[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "drug-safety-mcp"
version = "0.1.0"
description = "MCP server exposing FDA drug-safety data (labels, FAERS adverse events, recalls, interactions) plus a LangGraph agent that uses it."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Gopi Pamulapati" }]
dependencies = [
  "mcp>=1.9",
  "httpx>=0.27",
  "pydantic>=2.5",
]

[project.optional-dependencies]
agent = ["langgraph>=0.4", "langchain-core>=0.3", "langchain-openai>=0.3", "langchain-mcp-adapters>=0.1"]
dev = [
  "pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5",
  "langgraph>=0.4", "langchain-core>=0.3", "langchain-openai>=0.3", "langchain-mcp-adapters>=0.1",
]

[project.scripts]
drug-safety-mcp = "drug_safety_mcp.server:main"
drug-safety-agent = "drug_safety_mcp.agent:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.setuptools.package-data]
drug_safety_mcp = ["sample_data/*.json"]
